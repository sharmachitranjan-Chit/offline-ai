name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci 2>&1 | tee -a /tmp/build.log

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: set -o pipefail; ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a /tmp/build.log

      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/logs && cp /tmp/build.log /tmp/logs/build.log || true
          tail -c 400000 /tmp/logs/build.log > /tmp/logs/tail.log || true
          cd /tmp && rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q && git checkout -q -b cilogs
          cp /tmp/logs/tail.log ./build-${{ github.run_id }}.log
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm "log ${{ github.run_id }}"
          git push -q -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git cilogs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
